# MM-Flow Configuration
# Model IDs: update when Anthropic deprecates a version
# See: https://docs.anthropic.com/en/docs/about-claude/models
#
# Model format: "provider:model_id"
# Supported providers: anthropic, openrouter, z_ai
model_profiles:
  quality:
    model: "anthropic:claude-opus-4-6"
    use_when: "critical decisions, Brain #7 barrier"
  balanced:
    model: "anthropic:claude-sonnet-4-6"
    use_when: "standard domain brains"
  budget:
    model: "z_ai:claude-3-7-sonnet"
    use_when: "context recovery, status checks"

brain_routing:
  DISCUSSION:
    brains: [1, 2, 3]
    parallel: true
    barrier: [7]
    model_override: quality
  PLANNING:
    brains: [4, 5, 6]
    parallel: true
    barrier: [7]
  EXECUTION_WAVE:
    brains: [7]
    parallel: false
  VERIFICATION:
    brains: [7]
    parallel: false
    blocking: true

verification_gates:
  spec_coverage_threshold: 0.95
  max_gate_retries: 1
  escalate_on_failure: true

# Provider configuration
# env_key: environment variable name that holds the API key for this provider
# base_url: base HTTP/S URL for the provider's API (null = use SDK default)
providers:
  anthropic:
    env_key: ANTHROPIC_API_KEY
    base_url: null
  openrouter:
    env_key: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
  z_ai:
    env_key: ZAI_API_KEY
    base_url: "https://api.z.ai/v1"
