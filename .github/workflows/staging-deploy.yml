name: Staging Deploy

on:
  push:
    branches: [master, main]
    paths:
      - "apps/api/**"
      - "docker/api/**"
      - "apps/api/scripts/deploy-docker.sh"
      - ".github/workflows/staging-deploy.yml"
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Override staging base URL"
        required: false
        type: string
      image_tag:
        description: "Optional image tag override"
        required: false
        type: string

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
      STAGING_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_url || vars.STAGING_URL || secrets.STAGING_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure staging target is configured
        run: |
          if [ -z "${STAGING_URL}" ]; then
            echo "STAGING_URL is not configured. Set repo variable or secret STAGING_URL, or pass workflow_dispatch input staging_url."
            exit 1
          fi

      - name: Build and push API image
        working-directory: apps/api
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: bash scripts/deploy-docker.sh "${IMAGE_TAG}"

      - name: Wait for staging health
        run: |
          for attempt in $(seq 1 30); do
            result="$(python -c 'import os, sys, json, urllib.request; code = "import json\\nimport os\\nimport urllib.request\\nurl = os.environ[\\"STAGING_URL\\"].rstrip(\\"/\\") + \\\"/health\\\"\\nok = False\\ntry:\\n    with urllib.request.urlopen(url, timeout=10) as response:\\n        body = json.loads(response.read().decode(\\"utf-8\\"))\\n        ok = response.status == 200 and body.get(\\"status\\") == \\\"ok\\\"\\nexcept Exception:\\n    ok = False\\nsys.stdout.write(\\"ok\\" if ok else \\\"bad\\\")"; exec(code)')"
            if [ "${result}" = "ok" ]; then
              echo "Staging health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Staging health check failed for ${STAGING_URL}"
          exit 1

  notify_failure:
    needs: deploy
    if: needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update staging failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Staging deploy failed: ${context.workflow}`;
            const body = [
              'The staging deploy workflow failed and needs attention.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Fix the root cause, rerun the workflow, and verify the health check passes.',
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'staging-failure',
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'staging-failure',
                color: 'd73a4a',
                description: 'Staging deployment or health-check failure',
              });
            }

            const existing = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:staging-failure`,
              per_page: 10,
            });

            const openIssue = existing.find((issue) => issue.title === title);
            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['staging-failure'],
            });
